name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Test (with race detector)
        run: go test ./... -race -count=1 -v

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

  build-wasm:
    name: Build WASM demo
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build WASM binary
        run: GOOS=js GOARCH=wasm go build -o demo/query.wasm ./cmd/demo-wasm/

      - name: Copy wasm_exec.js runtime
        run: cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" demo/

      - name: Upload demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo
          path: demo/
          retention-days: 7
